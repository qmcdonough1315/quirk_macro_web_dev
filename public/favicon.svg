<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Soft shadow for the squircle container -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2D1B33" flood-opacity="0.22" />
    </filter>

    <!-- Subtle top-edge highlight -->
    <linearGradient id="surfaceSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14" />
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Coral ring gradient -->
    <linearGradient id="coralRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B" />
      <stop offset="100%" stop-color="#FF5C5C" />
    </linearGradient>

    <!-- Gold tail gradient -->
    <linearGradient id="goldTail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Transparent canvas -->
  <rect width="500" height="500" fill="none" />

  <!-- Rounded-square / squircle container -->
  <rect
    x="45"
    y="45"
    width="410"
    height="410"
    rx="110"
    ry="110"
    fill="#2D1B33"
    filter="url(#softShadow)"
  />

  <!-- Subtle surface sheen -->
  <rect
    x="45"
    y="45"
    width="410"
    height="410"
    rx="110"
    ry="110"
    fill="url(#surfaceSheen)"
  />

  <!-- Geometric Q mark group -->
  <g transform="translate(250, 250)">
    <!-- Q ring -->
    <circle
      cx="0"
      cy="0"
      r="118"
      fill="none"
      stroke="url(#coralRing)"
      stroke-width="58"
      stroke-linecap="round"
    />

    <!-- Inner accent dot -->
    <circle cx="0" cy="0" r="22" fill="#FFF9F8" opacity="0.18" />

    <!-- Gold data-bar tail, 45° -->
    <rect
      x="66"
      y="66"
      width="52"
      height="104"
      rx="14"
      fill="url(#goldTail)"
      transform="rotate(-45 66 66)"
    />
  </g>
</svg>
